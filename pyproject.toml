[project]
name = "semantic-rose"
version = "1.0.0"
description = "RoSE: RObust Metric for Semantic Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "penman>=1.3.0",
    "networkx>=3.1",
    "scipy>=1.10.0",
    "anyascii>=0.3.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

